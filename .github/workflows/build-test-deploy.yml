name: Build / Test / Deploy

on:
  push:
    branches: [ master, feature/modernize-and-support-rr6 ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      jobs:
        description: 'List of jobs to run'
        required: true
        default: 'build, test, lint'

jobs:
  build:
    if: (!github.event.inputs.jobs || contains(github.event.inputs.jobs, 'build'))
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: npm install, build and test
      run: |
        npm install --legacy-peer-deps
        npm run build --if-present
        npm run test
        npm run lint
    - name: Save root
      uses: actions/upload-artifact@v4
      with:
          name: root
          path: |
            ${{ github.workspace }}
            !./node_modules
        
        
  test:
    needs: build
    if: (!github.event.inputs.jobs || contains(github.event.inputs.jobs, 'test'))
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - name: Retrieve saved build
      uses: actions/download-artifact@v4
      with:
        name: root
        path: ${{ github.workspace }}
    - name: test
      run: |
        npm install --legacy-peer-deps
        npm run test
    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
          name: Test results
          path: coverage
        
        
  lint:
    needs: build
    if: (!github.event.inputs.jobs || contains(github.event.inputs.jobs, 'lint'))
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - name: Retrieve saved build
      uses: actions/download-artifact@v4
      with:
        name: root
        path: ${{ github.workspace }}
    - name: lint
      run: |
        npm install --legacy-peer-deps
        npm run lint
